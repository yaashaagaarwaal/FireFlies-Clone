# Render Blueprint for the backend. Import this repo at https://dashboard.render.com/blueprints
# and Render creates the service below automatically.
#
# FREE-TIER TRADEOFF (chosen deliberately — see README's Deployment section):
# this runs on Render's free plan with NO persistent disk. Render's free web
# services have an ephemeral filesystem, so the SQLite database is wiped on
# every restart, redeploy, and ~15-minute idle spin-down — scripts/start.sh
# reseeds 5 fresh demo meetings each time a container boots, so the app is
# never stuck with an empty dashboard, but nothing a user creates/edits
# persists across those resets. Free services also cold-start slowly
# (~30-50s) after spinning down from inactivity. If you need real
# persistence later, switch `plan` to `starter` and add a `disk:` block
# mounted at e.g. /var/data, with DATABASE_URL pointing inside it.
services:
  - type: web
    name: fireflies-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        value: sqlite:///./fireflies.db
      - key: ENVIRONMENT
        value: production
      # Set manually in the Render dashboard after the frontend is deployed
      # (its own Vercel URL) — never committed here.
      - key: CORS_ORIGINS
        sync: false
      # Optional: only needed to enable real Claude-generated summaries.
      # Leave unset to use the built-in heuristic generator.
      - key: ANTHROPIC_API_KEY
        sync: false

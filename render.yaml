# Render Blueprint for the backend. Import this repo at https://dashboard.render.com/blueprints
# and Render creates the service + disk below automatically.
#
# NOTE: SQLite needs a persistent disk, which Render only supports on paid
# instance plans (their free web-service tier has an ephemeral filesystem —
# the database would be wiped on every restart/redeploy). "starter" is their
# cheapest plan that supports attaching a disk; check render.com/pricing for
# current cost before deploying. Render also requires card verification to
# create a Blueprint at all, regardless of plan — confirmed directly, not
# assumed.
#
# Uses the same Dockerfile as everywhere else (backend/Dockerfile) instead of
# Render's auto-detected Python builder, so there's no ambiguity about Python
# version or how the app starts.
services:
  - type: web
    name: fireflies-backend
    runtime: docker
    plan: starter
    # Both paths are relative to the REPO ROOT, not to rootDir — so they must
    # name the backend/ subdirectory explicitly. rootDir is deliberately unset:
    # Render's blueprint spec and monorepo docs disagree on whether these paths
    # rebase onto it, and with no rootDir both readings resolve identically.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/fireflies.db
      - key: ENVIRONMENT
        value: production
      # Set manually in the Render dashboard after the frontend is deployed
      # (its own Vercel URL) — never committed here.
      - key: CORS_ORIGINS
        sync: false
      # Optional: only needed to enable real Claude-generated summaries.
      # Leave unset to use the built-in heuristic generator.
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: fireflies-data
      mountPath: /var/data
      sizeGB: 1
